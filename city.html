<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Drive</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b8d4ea;font-family:system-ui,sans-serif}
  #info{position:fixed;left:16px;top:14px;color:#fff;background:#0008;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.55;pointer-events:none}
  #pad{font-weight:700;margin-bottom:4px}
  #hud{position:fixed;right:28px;bottom:22px;color:#fff;text-shadow:0 2px 8px #000b;text-align:right;pointer-events:none}
  #speed{font-size:68px;font-weight:800;line-height:1}
  #unit{font-size:16px;opacity:.85}
</style>
</head>
<body>
<div id="info">
  <div id="pad">🎮 Branche la manette et appuie sur un bouton</div>
  RT accélérer · LT freiner / reculer · Stick gauche tourner<br>
  A frein à main · RB voler · Y caméra · Start replacer la voiture<br>
  <span style="opacity:.7">Clavier : flèches ou ZQSD, Espace, F voler, C, R</span>
</div>
<div id="hud"><div id="speed">0</div><div id="unit">km/h</div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ===== Réglages (modifiables) =====
const CONFIG = {
  cityCells: 40,     // ville = cityCells x cityCells pâtés de maisons de 80 m (40 → 3,2 km de côté)
  maxSpeed: 60,      // m/s (60 ≈ 216 km/h)
  maxReverse: 12,
  accel: 16,
  brake: 40,
  turnRate: 2.3,     // vitesse de rotation au braquage max (rad/s)
  grip: 8,           // adhérence latérale normale
  driftGrip: 1.2,    // adhérence au frein à main (plus bas = plus de dérapage)
  drag: 0.12,
  deadzone: 0.15,    // zone morte du stick
};

// ===== Rendu =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = 0xb8d4ea;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 750);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1000);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xe6f2ff, 0x6b6250, 1.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 400 });
scene.add(sun, sun.target);

// ===== Ville =====
const ROAD = 20, BLOCK = 60, CELL = ROAD + BLOCK;
const N = CONFIG.cityCells, SIZE = N * CELL, HALF = SIZE / 2;
let seed = 1337;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const isPark = new Uint8Array(N * N).map(() => rand() < 0.07 ? 1 : 0);
const blockTop = new Float32Array(N * N); // hauteur du plus haut bâtiment de chaque pâté

// 0 = route, 1 = parc (praticable), 2 = bâtiment / hors carte
function blockAt(x, z) {
  const lx = x + HALF, lz = z + HALF;
  if (lx < 0 || lz < 0 || lx >= SIZE || lz >= SIZE) return 2;
  const i = Math.floor(lx / CELL), j = Math.floor(lz / CELL);
  if (lx - i * CELL < ROAD || lz - j * CELL < ROAD) return 0;
  return isPark[i * N + j] ? 1 : 2;
}
// hauteur du sol sous (x, z) : toit, parc ou route (hors carte = mur infini)
function groundAt(x, z) {
  const b = blockAt(x, z);
  if (b !== 2) return b === 1 ? 0.3 : 0;
  const lx = x + HALF, lz = z + HALF;
  if (lx < 0 || lz < 0 || lx >= SIZE || lz >= SIZE) return Infinity;
  return blockTop[Math.floor(lx / CELL) * N + Math.floor(lz / CELL)];
}
const R = 2;
const solid = (x, z, y = 0) =>
  groundAt(x - R, z - R) > y + 0.5 || groundAt(x + R, z - R) > y + 0.5 ||
  groundAt(x - R, z + R) > y + 0.5 || groundAt(x + R, z + R) > y + 0.5;

function canvasTexture(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// Sol : une tuile = un pâté + ses deux rues (route sur les bords x=0 et y=0 de la tuile)
const roadTex = canvasTexture(512, g => {
  const r = ROAD * 512 / CELL;
  g.fillStyle = '#3a3d42'; g.fillRect(0, 0, 512, 512);
  for (let k = 0; k < 4000; k++) {
    g.fillStyle = `rgba(${rand() < 0.5 ? '0,0,0' : '255,255,255'},0.06)`;
    g.fillRect(rand() * 512, rand() * 512, 2, 2);
  }
  g.fillStyle = '#d9d9d9';
  g.fillRect(3, r, 3, 512 - r); g.fillRect(r - 6, r, 3, 512 - r);
  g.fillRect(r, 3, 512 - r, 3); g.fillRect(r, r - 6, 512 - r, 3);
  g.fillStyle = '#e8c547';
  for (let p = r + 6; p < 500; p += 26) {
    g.fillRect(r / 2 - 2, p, 4, 13);
    g.fillRect(p, r / 2 - 2, 13, 4);
  }
});
roadTex.repeat.set(N, N);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE, SIZE).rotateX(-Math.PI / 2),
  new THREE.MeshLambertMaterial({ map: roadTex })
);
ground.receiveShadow = true;
scene.add(ground);
const outside = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE * 4, SIZE * 4).rotateX(-Math.PI / 2),
  new THREE.MeshLambertMaterial({ color: 0x6f8f5a })
);
outside.position.y = -0.05;
scene.add(outside);

// Façades : une tuile = 12 m de haut (4 étages), d'où des hauteurs multiples de 12
const winTex = canvasTexture(128, g => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    g.fillStyle = rand() < 0.15 ? '#c9d6e3' : '#3b4a5e';
    g.fillRect(x * 32 + 5, y * 32 + 8, 22, 18);
  }
});

const unitBox = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const dummy = new THREE.Object3D();
const color = new THREE.Color();
const PALETTE = ['#d8d2c4', '#bfc6cc', '#9aa7b3', '#e4dccf', '#c9b8a3', '#8fa3b8', '#d6d9dc', '#a8b5a0', '#b8a89a'];

function instanced(geo, mat, items, shadows = true) {
  const m = new THREE.InstancedMesh(geo, mat, items.length);
  items.forEach((it, k) => {
    dummy.position.set(it.x, it.y || 0, it.z);
    dummy.scale.set(it.sx, it.sy, it.sz);
    dummy.updateMatrix();
    m.setMatrixAt(k, dummy.matrix);
    if (it.c) m.setColorAt(k, it.c);
  });
  m.castShadow = m.receiveShadow = shadows;
  scene.add(m);
  return m;
}

const sidewalks = [], parks = [], trees = [], byFloors = new Map();
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const cx = -HALF + i * CELL + ROAD + BLOCK / 2, cz = -HALF + j * CELL + ROAD + BLOCK / 2;
  const block = { x: cx, z: cz, sx: BLOCK, sy: 0.3, sz: BLOCK };
  if (isPark[i * N + j]) {
    parks.push(block);
    for (let t = 0; t < 10; t++)
      trees.push({ x: cx + (rand() - 0.5) * 50, z: cz + (rand() - 0.5) * 50, s: 0.8 + rand() * 0.7 });
    continue;
  }
  sidewalks.push(block);
  const core = Math.exp(-((cx * cx + cz * cz) / (HALF * HALF)) * 6); // plus haut au centre
  const lots = rand() < 0.2 ? [[0, 0, BLOCK - 6]] : [[-15, -15], [15, -15], [-15, 15], [15, 15]];
  for (const [ox, oz, big] of lots) {
    const w = big || 30 - 2 * (2 + rand() * 4), d = big || 30 - 2 * (2 + rand() * 4);
    const floors = Math.min(16, 1 + Math.floor(rand() * 2 + rand() ** 3 * 12 * core + core * 3 * rand()) + (big ? 1 : 0));
    color.set(PALETTE[Math.floor(rand() * PALETTE.length)]).offsetHSL(0, 0, (rand() - 0.5) * 0.08);
    if (!byFloors.has(floors)) byFloors.set(floors, []);
    blockTop[i * N + j] = Math.max(blockTop[i * N + j], 0.3 + floors * 12);
    byFloors.get(floors).push({ x: cx + ox, y: 0.3, z: cz + oz, sx: w, sy: floors * 12, sz: d, c: color.clone() });
  }
}
instanced(unitBox, new THREE.MeshLambertMaterial({ color: 0xb9b6ad }), sidewalks);
instanced(unitBox, new THREE.MeshLambertMaterial({ color: 0x5f9e4a }), parks, false);
const roofMat = new THREE.MeshLambertMaterial({ color: 0x8a8a8a });
for (const [floors, items] of byFloors) {
  const tex = winTex.clone();
  tex.repeat.set(2, floors);
  tex.needsUpdate = true;
  const side = new THREE.MeshLambertMaterial({ map: tex });
  instanced(unitBox, [side, side, roofMat, roofMat, side, side], items);
}
instanced(new THREE.CylinderGeometry(0.3, 0.4, 3, 6).translate(0, 1.8, 0), new THREE.MeshLambertMaterial({ color: 0x6b4a2f }),
  trees.map(t => ({ x: t.x, z: t.z, sx: t.s, sy: t.s, sz: t.s })));
instanced(new THREE.ConeGeometry(2.2, 5, 7).translate(0, 5.5, 0), new THREE.MeshLambertMaterial({ color: 0x2f6b34 }),
  trees.map(t => ({ x: t.x, z: t.z, sx: t.s, sy: t.s, sz: t.s })));

// ===== Voiture (avant = +z local) =====
const car = new THREE.Group();
const paint = new THREE.MeshStandardMaterial({ color: 0xd62828, metalness: 0.4, roughness: 0.35 });
const glass = new THREE.MeshStandardMaterial({ color: 0x1b2430, metalness: 0.6, roughness: 0.15 });
const part = (geo, mat, x, y, z) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  car.add(m);
  return m;
};
part(new THREE.BoxGeometry(2, 0.6, 4.4), paint, 0, 0.65, 0);
part(new THREE.BoxGeometry(1.7, 0.55, 2.2), glass, 0, 1.22, -0.3);
part(new THREE.BoxGeometry(1.9, 0.08, 0.5), paint, 0, 1.05, -2.0);
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff6d0, emissiveIntensity: 1 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0xff2020, emissiveIntensity: 0.6 });
for (const s of [-1, 1]) {
  part(new THREE.BoxGeometry(0.45, 0.15, 0.05), headMat, s * 0.65, 0.75, 2.21);
  part(new THREE.BoxGeometry(0.45, 0.15, 0.05), tailMat, s * 0.65, 0.75, -2.21);
}
const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 16).rotateZ(Math.PI / 2);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const wheels = [], frontPivots = [];
for (const [x, z] of [[-0.95, 1.4], [0.95, 1.4], [-0.95, -1.4], [0.95, -1.4]]) {
  const pivot = new THREE.Group();
  pivot.position.set(x, 0.38, z);
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.castShadow = true;
  pivot.add(w);
  car.add(pivot);
  wheels.push(w);
  if (z > 0) frontPivots.push(pivot);
}
scene.add(car);

// ===== Conduite =====
const pos = car.position;
const vel = new THREE.Vector2();
let heading = 0, fwd = 0, spin = 0, air = false, vy = 0;

function resetCar() {
  const snap = v => -HALF + ROAD / 2 + Math.max(0, Math.min(N - 1, Math.round((v + HALF - ROAD / 2) / CELL))) * CELL;
  pos.set(snap(pos.x), 0, snap(pos.z));
  heading = Math.round(heading / (Math.PI / 2)) * (Math.PI / 2);
  vel.set(0, 0);
  air = false; vy = 0;
}
pos.set(-HALF + ROAD / 2 + (N >> 1) * CELL, 0, -HALF + ROAD / 2 + (N >> 1) * CELL);

const CAMS = [{ dist: 9, height: 3.8, look: 1.5 }, { dist: 17, height: 7.5, look: 1 }, { hood: true }];
let camMode = 0;
const nextCam = () => { camMode = (camMode + 1) % CAMS.length; };

// ===== Entrées =====
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!e.repeat && e.code === 'KeyC') nextCam();
  if (!e.repeat && e.code === 'KeyR') resetCar();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const padEl = document.getElementById('pad');
addEventListener('gamepadconnected', e => { padEl.textContent = '🎮 Manette connectée : ' + e.gamepad.id.split('(')[0].trim(); });
addEventListener('gamepaddisconnected', () => { padEl.textContent = '🎮 Manette déconnectée'; });

let prevButtons = [];
function readInput() {
  let steer = 0, throttle = 0, brake = 0, handbrake = false, fly = false;
  const gp = [...(navigator.getGamepads?.() || [])].find(p => p && p.connected);
  if (gp) {
    const x = gp.axes[0] || 0, dz = CONFIG.deadzone;
    const s = Math.abs(x) < dz ? 0 : (x - Math.sign(x) * dz) / (1 - dz);
    steer = Math.sign(s) * s * s;
    throttle = gp.buttons[7]?.value || 0;
    brake = gp.buttons[6]?.value || 0;
    handbrake = !!gp.buttons[0]?.pressed;
    fly = !!gp.buttons[5]?.pressed;
    const pressed = i => gp.buttons[i]?.pressed && !prevButtons[i];
    if (pressed(3)) nextCam();
    if (pressed(9)) resetCar();
    prevButtons = gp.buttons.map(b => b.pressed);
  }
  if (keys.ArrowUp || keys.KeyW) throttle = 1;
  if (keys.ArrowDown || keys.KeyS) brake = 1;
  if (keys.ArrowLeft || keys.KeyA) steer = -1;
  if (keys.ArrowRight || keys.KeyD) steer = 1;
  if (keys.Space) handbrake = true;
  if (keys.KeyF) fly = true;
  return { steer, throttle, brake, handbrake, fly };
}

function update(dt) {
  const inp = readInput();
  let fx = Math.sin(heading), fz = Math.cos(heading);
  fwd = vel.x * fx + vel.y * fz;
  let lat = vel.x * fz - vel.y * fx;

  if (inp.throttle > 0) fwd += inp.throttle * CONFIG.accel * (1 - Math.max(0, fwd) / CONFIG.maxSpeed) * dt;
  if (inp.brake > 0) {
    if (fwd > 0.5) fwd = Math.max(0, fwd - inp.brake * CONFIG.brake * dt);
    else fwd = Math.max(-CONFIG.maxReverse, fwd - inp.brake * CONFIG.accel * 0.6 * dt);
  }
  const coast = (inp.throttle || inp.brake ? 0 : 2) + (inp.handbrake ? 8 : 0);
  fwd -= Math.sign(fwd) * Math.min(Math.abs(fwd), coast * dt);
  const onPark = !air && blockAt(pos.x, pos.z) === 1;
  fwd -= fwd * (CONFIG.drag + (onPark ? 1.5 : 0)) * dt;
  if (!air) lat *= Math.exp(-(inp.handbrake ? CONFIG.driftGrip : CONFIG.grip) * dt);

  const turn = Math.min(1, Math.abs(fwd) / 6) / (1 + Math.abs(fwd) / 45);
  heading -= inp.steer * CONFIG.turnRate * turn * Math.sign(fwd) * (inp.handbrake ? 1.4 : 1) * dt;
  fx = Math.sin(heading); fz = Math.cos(heading);
  vel.set(fx * fwd + fz * lat, fz * fwd - fx * lat);

  const nx = pos.x + vel.x * dt, nz = pos.z + vel.y * dt;
  if (!solid(nx, nz, pos.y)) { pos.x = nx; pos.z = nz; }
  else if (!solid(nx, pos.z, pos.y)) { pos.x = nx; vel.y *= -0.3; }
  else if (!solid(pos.x, nz, pos.y)) { pos.z = nz; vel.x *= -0.3; }
  else vel.multiplyScalar(-0.3);

  // vol (RB) : on monte tant que RB est tenu, sinon on retombe (on peut se poser sur les toits)
  const ground = groundAt(pos.x, pos.z);
  if (inp.fly) { air = true; vy = Math.min(14, vy + 30 * dt); }
  else if (!air && pos.y > ground + 0.5) air = true; // on roule hors d'un toit : chute
  else if (air) vy = Math.max(-25, vy - 9.81 * dt);
  if (air) {
    pos.y = Math.min(400, pos.y + vy * dt);
    if (pos.y <= ground && vy <= 0) { pos.y = ground; air = false; vy = 0; }
  } else pos.y += (ground - pos.y) * Math.min(1, dt * 10);
  const k = 1 - Math.exp(-10 * dt);
  car.rotation.x += ((air ? -vy * 0.03 : 0) - car.rotation.x) * k;
  car.rotation.z += ((air ? inp.steer * 0.35 : 0) - car.rotation.z) * k;
  car.rotation.y = heading;
  spin += fwd * dt / 0.38;
  for (const w of wheels) w.rotation.x = spin;
  for (const p of frontPivots) p.rotation.y = -inp.steer * 0.5;
}

const camTarget = new THREE.Vector3();
function updateCamera(dt) {
  const fx = Math.sin(heading), fz = Math.cos(heading), m = CAMS[camMode];
  if (m.hood) {
    camera.position.set(pos.x + fx * 0.3, pos.y + 1.4, pos.z + fz * 0.3);
    camera.lookAt(pos.x + fx * 10, pos.y + 1.2, pos.z + fz * 10);
  } else {
    camTarget.set(pos.x - fx * m.dist, pos.y + m.height, pos.z - fz * m.dist);
    camera.position.lerp(camTarget, 1 - Math.exp(-6 * dt));
    camera.lookAt(pos.x + fx * 3, pos.y + m.look, pos.z + fz * 3);
  }
  camera.fov = 65 + Math.abs(fwd) * 0.25;
  camera.updateProjectionMatrix();
  sun.position.set(pos.x + 60, pos.y + 120, pos.z + 40);
  sun.target.position.copy(pos);
}

const speedEl = document.getElementById('speed');
const clock = new THREE.Clock();
updateCamera(1);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  updateCamera(dt);
  speedEl.textContent = Math.round(Math.abs(fwd) * 3.6);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
